<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=390, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Jarek Pawelczyk</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@300;400;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 390px;
      height: 844px;
      overflow: hidden;
      position: relative;
      background: #100c06;
      font-family: 'Rajdhani', sans-serif;
    }

    /* ── BACKGROUND ──────────────────────────────────────── */
    .bg-image {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 0;
    }
    .bg-image img {
      position: absolute;
      width: 100%;
      top: 0px;
      left: 0;
    }

    /* Cinematic dark vignette — focus light at center-top */
    .bg-vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 320px 400px at 195px 280px, transparent 30%, rgba(0,0,0,0.18) 80%),
        linear-gradient(180deg,
          rgba(0,0,0,0.15) 0%,
          transparent 18%,
          transparent 50%,
          rgba(5,3,1,0.68) 72%,
          rgba(5,3,1,0.92) 88%,
          rgba(5,3,1,0.97) 100%
        );
      z-index: 1;
    }

    /* Subtle film grain overlay */
    .bg-grain {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 160px 160px;
    }

    /* ── CORNER MARKS ────────────────────────────────────── */
    .corner {
      position: absolute;
      z-index: 5;
      pointer-events: none;
      opacity: 0.5;
    }
    .corner-tl { top: 18px; left: 18px; }
    .corner-tr { top: 18px; right: 18px; }
    .corner-bl { bottom: 18px; left: 18px; }
    .corner-br { bottom: 18px; right: 18px; }

    /* ── TOP STATUS BAR ──────────────────────────────────── */
    .top-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 56px;
      padding: 0 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 8;
    }
    .event-pill {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .event-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #ff8c00;
      flex-shrink: 0;
      animation: dotPulse 2.4s ease-in-out infinite;
    }
    @keyframes dotPulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(255,140,0,0.6); }
      50%       { opacity: 0.7; box-shadow: 0 0 0 5px rgba(255,140,0,0); }
    }
    .event-label {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,155,30,0.80);
    }
    .event-date {
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.14em;
      color: rgba(255,255,255,0.32);
    }

    /* ── BOTTOM INFO PANEL ───────────────────────────────── */
    .info-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0 28px calc(160px + env(safe-area-inset-bottom));
      z-index: 8;
    }

    .name {
      font-family: 'Bebas Neue', 'Arial Black', sans-serif;
      font-size: 54px;
      letter-spacing: 0.045em;
      line-height: 0.92;
      color: #fff;
      text-shadow: 0 2px 32px rgba(0,0,0,0.9), 0 0 48px rgba(255,120,0,0.18);
      margin-bottom: 7px;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      text-align: left;
      display: block;
      width: 100%;
    }

    .role {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.30em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      margin-bottom: 0;
    }

    /* ── QR OVERLAY ──────────────────────────────────────── */
    .qr-overlay {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .qr-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(6, 4, 2, 0.88);
      backdrop-filter: blur(18px) saturate(1.6);
      -webkit-backdrop-filter: blur(18px) saturate(1.6);
      opacity: 0;
      transition: opacity 0.38s ease;
    }

    .qr-box {
      position: relative;
      z-index: 1;
      text-align: center;
      transform: scale(0.65) translateY(44px);
      opacity: 0;
      transition:
        transform 0.52s cubic-bezier(0.34, 1.56, 0.64, 1),
        opacity 0.32s ease;
      will-change: transform, opacity;
    }

    .qr-overlay.visible {
      pointer-events: all;
    }
    .qr-overlay.visible .qr-backdrop {
      opacity: 1;
    }
    .qr-overlay.visible .qr-box {
      transform: scale(1) translateY(0);
      opacity: 1;
    }
    .qr-overlay.hiding .qr-box {
      transform: scale(0.65) translateY(44px);
      opacity: 0;
      transition:
        transform 0.38s cubic-bezier(0.55, 0, 1, 0.45),
        opacity 0.28s ease;
    }
    .qr-overlay.hiding .qr-backdrop {
      opacity: 0;
    }

    /* QR code light frame */
    .qr-frame {
      display: inline-block;
      padding: 12px;
      border-radius: 10px;
      background: #f5f0e8;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255,140,0,0.22),
        0 0 50px rgba(255,120,0,0.16),
        0 28px 70px rgba(0,0,0,0.85);
      margin-bottom: 22px;
    }

    /* Corner accent marks on QR frame */
    .qr-frame::before, .qr-frame::after {
      content: '';
      position: absolute;
      width: 16px; height: 16px;
      border-color: #ff8c00;
      border-style: solid;
      z-index: 3;
    }
    .qr-frame::before { top: 5px;  left: 5px;  border-width: 2px 0 0 2px; border-radius: 2px 0 0 0; }
    .qr-frame::after  { bottom: 5px; right: 5px; border-width: 0 2px 2px 0; border-radius: 0 0 2px 0; }

    /* Scan line sweep */
    .scan-line {
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(255,140,0,0.5) 20%,
        rgba(255,175,60,0.95) 50%,
        rgba(255,140,0,0.5) 80%,
        transparent 100%
      );
      box-shadow: 0 0 8px rgba(255,140,0,0.7), 0 0 20px rgba(255,140,0,0.3);
      top: 0;
      z-index: 4;
      pointer-events: none;
      animation: scanSweep 2.8s ease-in-out infinite;
    }
    @keyframes scanSweep {
      0%   { top: -4px; opacity: 0; }
      8%   { opacity: 1; }
      92%  { opacity: 1; }
      100% { top: calc(100% + 4px); opacity: 0; }
    }

    #qrcode canvas,
    #qrcode img { display: block; border-radius: 3px; }

    .qr-overlay-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.30em;
      text-transform: uppercase;
      color: rgba(255,140,0,0.55);
      margin-bottom: 22px;
    }

    .qr-name {
      font-family: 'Bebas Neue', 'Arial Black', sans-serif;
      font-size: 30px;
      letter-spacing: 0.06em;
      color: #fff;
      line-height: 1;
      margin-bottom: 5px;
    }

    .qr-handle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: rgba(255,195,90,0.82);
      margin-bottom: 28px;
    }
    .qr-handle svg { fill: rgba(255,140,0,0.75); flex-shrink: 0; }

    .qr-hint {
      font-size: 9px;
      letter-spacing: 0.20em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.22);
    }

    /* Dismiss ring animation */
    .dismiss-ring {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }
    .dismiss-ring::before {
      content: '';
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.08);
      animation: ringPulse 2.6s ease-in-out infinite;
    }
    @keyframes ringPulse {
      0%, 100% { transform: scale(1);   opacity: 0.5; }
      50%       { transform: scale(1.35); opacity: 0; }
    }
    .dismiss-x {
      font-size: 14px;
      color: rgba(255,255,255,0.35);
      line-height: 1;
      margin-top: -1px;
    }
  </style>
</head>
<body>

<!-- Background layers -->
<div class="bg-image"><img src="i_am_legend_j.png" alt=""></div>
<div class="bg-vignette"></div>
<div class="bg-grain"></div>

<!-- Corner marks -->
<svg class="corner corner-tl" width="22" height="22" viewBox="0 0 22 22" fill="none">
  <path d="M1,11 L1,1 L11,1" stroke="rgba(255,140,0,0.40)" stroke-width="1.4"/>
</svg>
<svg class="corner corner-tr" width="22" height="22" viewBox="0 0 22 22" fill="none">
  <path d="M11,1 L21,1 L21,11" stroke="rgba(255,140,0,0.40)" stroke-width="1.4"/>
</svg>
<svg class="corner corner-bl" width="22" height="22" viewBox="0 0 22 22" fill="none">
  <path d="M1,11 L1,21 L11,21" stroke="rgba(255,140,0,0.25)" stroke-width="1.4"/>
</svg>
<svg class="corner corner-br" width="22" height="22" viewBox="0 0 22 22" fill="none">
  <path d="M21,11 L21,21 L11,21" stroke="rgba(255,140,0,0.25)" stroke-width="1.4"/>
</svg>

<!-- Top bar -->
<div class="top-bar">
  <div class="event-pill">
    <div class="event-dot"></div>
    <span class="event-label">AI Devs 4 · Wrocław</span>
  </div>
  <span class="event-date">Apr 2026</span>
</div>

<!-- Bottom info panel -->
<div class="info-panel">
  <button class="name" id="connectBtn" aria-label="Show QR code">Jarek<br>Pawelczyk</button>
  <div class="role">Software Engineer</div>
</div>

<!-- QR Overlay -->
<div class="qr-overlay" id="qrOverlay" role="dialog" aria-modal="true" aria-label="QR code">
  <div class="qr-backdrop" id="qrBackdrop"></div>
  <div class="qr-box">
    <div class="qr-overlay-label">Scan to connect</div>
    <div class="qr-frame">
      <div class="scan-line"></div>
      <div id="qrcode"></div>
    </div>
    <div class="qr-name">Jarek Pawelczyk</div>
    <div class="qr-handle">
      <svg width="13" height="13" viewBox="0 0 24 24">
        <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.79M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/>
      </svg>
      /jaroslawpawelczyk
    </div>
    <div class="qr-hint">tap anywhere to close</div>
  </div>
  <div class="dismiss-ring">
    <span class="dismiss-x">✕</span>
  </div>
</div>

<script>
  new QRCode(document.getElementById('qrcode'), {
    text: 'https://linkedin.com/in/jaroslawpawelczyk',
    width: 188,
    height: 188,
    colorDark: '#1c1007',
    colorLight: '#f5f0e8',
    correctLevel: QRCode.CorrectLevel.H
  });

  const btn = document.getElementById('connectBtn');
  const overlay = document.getElementById('qrOverlay');
  let visible = false;
  let hideTimer = null;

  function showQR() {
    if (visible) return;
    visible = true;
    clearTimeout(hideTimer);
    overlay.classList.remove('hiding');
    overlay.classList.add('visible');
  }

  function hideQR() {
    if (!visible) return;
    visible = false;
    overlay.classList.remove('visible');
    overlay.classList.add('hiding');
    hideTimer = setTimeout(() => overlay.classList.remove('hiding'), 520);
  }

  btn.addEventListener('click', e => {
    e.stopPropagation();
    showQR();
  });

  overlay.addEventListener('click', hideQR);
</script>

</body>
</html>
